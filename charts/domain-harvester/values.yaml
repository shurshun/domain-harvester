image:
  repository: ghcr.io/shurshun/domain-harvester
  # Defaults to .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# The domain cache lives in memory and every replica watches the whole
# cluster independently, so running more than one just multiplies WHOIS
# traffic without adding availability. Leave at 1 unless you're testing
# a rolling update.
replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true
  # Discovering domains means watching Ingress across every namespace, which
  # needs a ClusterRole/ClusterRoleBinding. Set to false to install a
  # namespace-scoped Role/RoleBinding instead — the app will then only see
  # Ingresses in its own namespace.
  clusterWide: true

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 8080
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

# The optional YAML domain source, alongside the in-cluster Ingress watcher.
# Disabled by default: the binary's own --config default ("config.yml") does
# not exist in the image, so leaving this off just means the app logs one
# harmless "can't load config file" line and runs on Ingress-discovered
# domains only.
config:
  enabled: false
  projects: {}
  # projects:
  #   google:
  #     - google.com

# Optional CRD-backed domain sources, alongside the in-cluster Ingress
# watcher. Each is off by default and independently toggleable: enabling one
# adds RBAC for just that CRD (see templates/rbac.yaml) and the matching
# --enable-* flag. The app itself tolerates the CRD not actually being
# installed even when enabled here — it logs and carries on without that
# source rather than crashing — but there's no point granting RBAC for a
# source you don't intend to use, hence the toggle.
sources:
  # Traefik's IngressRoute (traefik.io/v1alpha1); domains are the backtick-quoted
  # hostnames in each route's `Host(...)` matcher.
  traefikIngressRoute:
    enabled: false
  # Gateway API HTTPRoute (gateway.networking.k8s.io/v1); domains are spec.hostnames.
  gatewayHTTPRoute:
    enabled: false
  # Gateway API GRPCRoute (gateway.networking.k8s.io/v1); domains are spec.hostnames.
  gatewayGRPCRoute:
    enabled: false
  # Highest priority first: when the same domain is seen from more than one
  # enabled source (e.g. an Ingress and an HTTPRoute both routing
  # example.com), this decides whose Ingress/namespace labels win. Sources
  # left out sort after everything listed here.
  priority:
    - cluster
    - config
    - ingressroute
    - httproute
    - grpcroute

# CLI flags exposed as env vars; see `domain-harvester --help`.
env:
  logLevel: info
  whoisConcurrency: 16
  whoisTimeout: 10s
  whoisRefreshInterval: 60m
  whoisNearExpiryInterval: 10m
  whoisErrorRetryInterval: 15m
  rebuildInterval: 1m
  enablePprof: false

# Extra env vars appended as-is, e.g. for a proxy: [{name: HTTPS_PROXY, value: ...}]
extraEnv: []

livenessProbe:
  httpGet:
    path: /_liveness
    port: metrics
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 1

readinessProbe:
  httpGet:
    path: /_readiness
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 1

serviceMonitor:
  # Requires the prometheus-operator CRDs.
  enabled: false
  interval: 30s
  scrapeTimeout: ""
  labels: {}
  annotations: {}

prometheusRule:
  # Requires the prometheus-operator CRDs.
  enabled: false
  labels: {}
  annotations: {}
  # Evaluation interval for the domain-harvester rule group; empty = inherit the
  # Prometheus global default.
  interval: ""
  nearExpiryDays: 30
  criticalExpiryDays: 15
  staleAfterSeconds: 86400
  defaultRules:
    # The built-in DomainUpdateError / DomainLastUpdate / DomainExpiryWarn /
    # DomainExpiryCritical / DomainExpired alerts. Turn off to ship only
    # additionalRules below.
    enabled: true
  # Extra alert (or recording) rules appended verbatim to the same rule group.
  # Not templated by Helm, so `{{ $labels.x }}` / `{{ $value }}` can be written
  # as-is. The set below covers exporter-level health — cache rebuilds and
  # outbound WHOIS/RDAP traffic — which the per-domain defaults don't touch;
  # uncomment what you want.
  additionalRules: []
  # additionalRules:
  #   # The cache rebuild loop stopped: rebuilds are unconditionally triggered
  #   # every minute, so a timestamp this old means the loop is wedged (or the
  #   # rebuild mutex is held by a stuck WHOIS fan-out).
  #   - alert: DomainCacheRebuildStalled
  #     expr: time() - domain_cache_last_rebuild_timestamp > 600
  #     for: 5m
  #     labels:
  #       severity: critical
  #     annotations:
  #       summary: Domain cache rebuilds have stalled
  #       description: >-
  #         No completed cache rebuild for {{ $value | humanizeDuration }}
  #         on {{ $labels.instance }}.
  #   # Rebuilds run under a single mutex; a slow one delays every source's
  #   # updates, usually because WHOIS lookups are timing out.
  #   - alert: DomainCacheRebuildSlow
  #     expr: domain_cache_rebuild_duration_seconds > 120
  #     for: 10m
  #     labels:
  #       severity: warning
  #     annotations:
  #       summary: Domain cache rebuilds are slow
  #       description: >-
  #         Last rebuild on {{ $labels.instance }} took
  #         {{ $value | humanizeDuration }}.
  #   # The whois cache should keep outbound traffic to a trickle (errored
  #   # entries retry every 15m, near-expiry every 10m, the rest hourly); a
  #   # sustained high rate means the cache is being bypassed or everything errors.
  #   - alert: DomainWhoisRequestRateHigh
  #     expr: rate(domain_whois_requests[15m]) > 1
  #     for: 30m
  #     labels:
  #       severity: warning
  #     annotations:
  #       summary: Outbound WHOIS/RDAP request rate is high
  #       description: >-
  #         {{ $labels.instance }} is issuing {{ $value | printf "%.2f" }}
  #         WHOIS/RDAP requests per second.
  #   # A source that silently stopped reporting: its series vanished entirely.
  #   # absent() is required here — `count by (source) (...) == 0` can never fire,
  #   # since a source with no series produces no group to compare against. Repeat
  #   # the alert per source this release actually enables.
  #   - alert: DomainSourceHasNoDomains
  #     expr: absent(domain_expiry_days{source="cluster"})
  #     for: 15m
  #     labels:
  #       severity: warning
  #     annotations:
  #       summary: A domain source reports no domains
  #       description: Source "cluster" has no domains in the cache.
  #   - alert: DomainHarvesterDown
  #     expr: up{job=~".*domain-harvester.*"} == 0
  #     for: 5m
  #     labels:
  #       severity: critical
  #     annotations:
  #       summary: domain-harvester is not scrapeable
  #       description: "{{ $labels.instance }} has been down for 5m."

dashboard:
  # Ships dashboards/domain-harvester.json as a ConfigMap, picked up by the
  # grafana/grafana chart's default sidecar (grafana.sidecar.dashboards.enabled).
  enabled: false
  sidecarLabel: grafana_dashboard
  sidecarLabelValue: "1"
  annotations: {}
