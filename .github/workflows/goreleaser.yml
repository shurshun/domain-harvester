name: goreleaser

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - v*
    paths-ignore:
      - 'charts/**'
      - 'deploy/**'
      - 'config.yml'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'charts/**'
      - 'deploy/**'
      - 'config.yml'
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Set up envtest binaries (kube-apiserver, etcd) for the CRD-source integration tests
        run: echo "KUBEBUILDER_ASSETS=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@latest use -p path)" >> "$GITHUB_ENV"
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - uses: azure/setup-helm@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach an SBOM to the container image
        # goreleaser's docker_signs already covers signing (artifacts: manifests).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v} # goreleaser tags images without the leading 'v'
          IMAGE="ghcr.io/${{ github.repository_owner }}/domain-harvester:$VERSION"
          syft "$IMAGE" -o spdx-json > sbom.spdx.json
          cosign attach sbom --sbom sbom.spdx.json "$IMAGE"

      - name: Package and push the Helm chart
        # helm has its own OCI credential store, separate from the docker
        # login above, even though it's the same registry.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v} # chart versions don't carry the leading 'v'
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/domain-harvester --version "$VERSION" --app-version "$VERSION" --destination dist-chart
          helm push "dist-chart/domain-harvester-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Sign published Helm chart
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
          VERSION=${TAG#v}
          CHART_REF="ghcr.io/$REGISTRY_OWNER/charts/domain-harvester"
          DIGEST=$(crane digest "$CHART_REF:$VERSION")
          cosign sign --yes "$CHART_REF@$DIGEST"

      - name: Sign checksums and verify published release
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          NAME=${GITHUB_REPOSITORY#*/}
          IMAGE="ghcr.io/$REGISTRY_OWNER/$NAME"
          IDENTITY="https://github.com/$GITHUB_REPOSITORY/.github/workflows/goreleaser.yml@refs/tags/$TAG"
          ISSUER=https://token.actions.githubusercontent.com
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
          CHECKSUMS="dist/${NAME}_${VERSION}_checksums.txt"
          test -s "$CHECKSUMS"
          (cd dist && sha256sum -c "${NAME}_${VERSION}_checksums.txt")
          cosign sign-blob --yes --bundle "$CHECKSUMS.sigstore.json" "$CHECKSUMS"
          cosign verify-blob --bundle "$CHECKSUMS.sigstore.json" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$CHECKSUMS"
          gh release upload "$TAG" "$CHECKSUMS.sigstore.json" --clobber
          mkdir -p verify-release
          gh release download "$TAG" --dir verify-release --pattern '*.tar.gz' --pattern '*_checksums.txt' --pattern '*.sbom.json'
          test "$(find verify-release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          (cd verify-release && sha256sum -c "${NAME}_${VERSION}_checksums.txt")
          crane manifest "$IMAGE:$VERSION" | jq -e '[.manifests[].platform.architecture] | contains(["amd64", "arm64"])'
          DIGEST=$(crane digest "$IMAGE:$VERSION")
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$IMAGE@$DIGEST"
          helm pull "oci://ghcr.io/$REGISTRY_OWNER/charts/$NAME" --version "$VERSION" --destination verify-release
          CHART_REF="ghcr.io/$REGISTRY_OWNER/charts/$NAME"
          CHART_DIGEST=$(crane digest "$CHART_REF:$VERSION")
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$CHART_REF@$CHART_DIGEST"
          METADATA=$(helm show chart "verify-release/$NAME-$VERSION.tgz")
          test "$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2}' <<< "$METADATA")" = "$VERSION"
          test "$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' <<< "$METADATA")" = "$VERSION"
