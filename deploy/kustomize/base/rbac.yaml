apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: domain-harvester
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # The app's optional CRD-backed domain sources are all off by default
  # (ENABLE_TRAEFIK_INGRESSROUTE / ENABLE_GATEWAY_HTTPROUTE /
  # ENABLE_GATEWAY_GRPCROUTE), so RBAC for them isn't included here either —
  # add whichever of these you actually enable:
  # - apiGroups: ["traefik.io"]
  #   resources: ["ingressroutes"]
  #   verbs: ["get", "list", "watch"]
  # - apiGroups: ["gateway.networking.k8s.io"]
  #   resources: ["httproutes"]
  #   verbs: ["get", "list", "watch"]
  # - apiGroups: ["gateway.networking.k8s.io"]
  #   resources: ["grpcroutes"]
  #   verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: domain-harvester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: domain-harvester
subjects:
  # kustomize's namespace transformer rewrites this to the overlay's
  # namespace; it is a ClusterRoleBinding so the binding itself stays cluster-scoped.
  - kind: ServiceAccount
    name: domain-harvester
    namespace: default
