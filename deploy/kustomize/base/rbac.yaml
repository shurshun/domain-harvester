apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: domain-harvester
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: domain-harvester
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: domain-harvester
subjects:
  # kustomize's namespace transformer rewrites this to the overlay's
  # namespace; it is a ClusterRoleBinding so the binding itself stays cluster-scoped.
  - kind: ServiceAccount
    name: domain-harvester
    namespace: default
