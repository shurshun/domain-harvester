apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: domain-harvester-prod

resources:
  - ../../base
  - namespace.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: domain-harvester-config
    behavior: replace
    files:
      - config.yml

patches:
  - path: deployment-patch.yaml

images:
  - name: ghcr.io/shurshun/domain-harvester
    newTag: "1.9.0"

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/instance: prod
